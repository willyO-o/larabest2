name: build-macos
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Un solo .dmg para Apple Silicon e Intel. Firma ad hoc, sin Apple
      # Developer: la primera vez hay que permitirla en Privacidad y seguridad.
      - run: npm run tauri build -- --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Los servicios reales de Homebrew: arranque, sitios, WordPress, Laravel,
  # Adminer, PostgreSQL, correo a Mailpit, HTTPS, cambio de PHP y limpieza de
  # huérfanos.
  servicios:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # MongoDB no está en homebrew-core: su tap hay que agregarlo y marcarlo
      # como de confianza.
      - run: brew tap mongodb/brew && brew trust mongodb/brew
      - run: >-
          brew install nginx php@8.3 php@8.4 mariadb@11.4 postgresql@17 redis
          mailpit mongodb/brew/mongodb-community
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --ignored --nocapture e2e_homebrew
        env:
          LARABEST_E2E_ROOT: ${{ runner.temp }}/larabest-e2e
      - if: failure()
        run: tail -n 60 "$RUNNER_TEMP"/larabest-e2e/logs/* || true
