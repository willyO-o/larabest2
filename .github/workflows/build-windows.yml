name: build-windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Incluye HeidiSQL y Notepad++ (scripts/fetch-bundled.mjs).
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  # Agrega todo desde el menú Agregar (descargas oficiales reales) y arranca
  # la pila: sitios, correo a Mailpit, Adminer, phpMyAdmin, WordPress,
  # Laravel, MongoDB cerrado con Ctrl+C, HTTPS, cambio de PHP y huérfanos.
  servicios:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --ignored --nocapture e2e_windows
        env:
          LARABEST_E2E_ROOT: ${{ runner.temp }}\larabest-e2e
      - if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\larabest-e2e\logs" -File -ErrorAction SilentlyContinue |
            ForEach-Object { "==== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
