name: build-windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  # Agrega todo desde el menú Agregar (descargas oficiales reales) y arranca
  # la pila: sitios, correo a Mailpit, Adminer, phpMyAdmin, WordPress,
  # Laravel, MongoDB cerrado con Ctrl+C, HTTPS, cambio de PHP y huérfanos.
  servicios:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: set -o pipefail; cargo test --manifest-path src-tauri/Cargo.toml --lib -- --ignored --nocapture e2e_windows 2>&1 | tee "$RUNNER_TEMP/e2e.log"
        shell: bash
        env:
          LARABEST_E2E_ROOT: ${{ runner.temp }}\larabest-e2e
      - if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:RUNNER_TEMP\larabest-e2e\logs" -File -ErrorAction SilentlyContinue |
            ForEach-Object { "==== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
      # El log del job no siempre se puede leer desde fuera: el motivo del
      # fallo queda también como anotación del job.
      - if: failure()
        shell: bash
        run: |
          {
            grep -m 5 -A 30 -E "panicked|^error" "$RUNNER_TEMP/e2e.log"
            echo "---- últimas líneas"
            tail -n 200 "$RUNNER_TEMP/e2e.log"
          } > "$RUNNER_TEMP/e2e-summary.txt" || true
          head -c 60000 "$RUNNER_TEMP/e2e-summary.txt" > "$RUNNER_TEMP/e2e-short.txt"
          msg=$(awk '{ gsub(/\r/, ""); gsub(/%/, "%25"); printf "%s%%0A", $0 }' "$RUNNER_TEMP/e2e-short.txt")
          echo "::error title=e2e::${msg}"
