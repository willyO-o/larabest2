[package]
name = "larabest"
version = "0.1.0"
description = "Servidor local con Nginx, PHP y MariaDB"
authors = ["SOGLOTEC"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
thiserror = "2"
async-trait = "0.1.92"
minijinja = "2"
notify = "8"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha1 = "0.10"
x509-cert = { version = "0.2.5", features = ["builder", "pem"] }
sha2 = { version = "0.10.9", features = ["oid"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
win32job = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
