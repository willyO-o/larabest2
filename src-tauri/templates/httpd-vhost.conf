# Generado por {{ app_name }}. No editar: se regenera al cambiar www/.
# Para personalizar este sitio crea {{ custom_dir }}/{{ name }}.conf

<VirtualHost *:{{ http_port }}>
    ServerName {{ domain }}
    ServerAlias *.{{ domain }}
    DocumentRoot "{{ root }}"
    <Directory "{{ root }}">
        Options FollowSymLinks
        AllowOverride All
        CGIPassAuth On
        Require all granted
    </Directory>
    IncludeOptional "{{ custom_dir }}/{{ name }}.conf*"
</VirtualHost>
{%- if ssl %}

<VirtualHost *:{{ https_port }}>
    ServerName {{ domain }}
    ServerAlias *.{{ domain }}
    DocumentRoot "{{ root }}"
    SSLEngine on
    SSLCertificateFile "{{ ssl_cert }}"
    SSLCertificateKeyFile "{{ ssl_key }}"
    <Directory "{{ root }}">
        Options FollowSymLinks
        AllowOverride All
        CGIPassAuth On
        Require all granted
    </Directory>
    IncludeOptional "{{ custom_dir }}/{{ name }}.conf*"
</VirtualHost>
{%- endif %}
