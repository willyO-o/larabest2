# Generado por {{ app_name }}. No editar: se regenera en cada inicio.
# Para configuración propia de un sitio crea {{ custom_dir }}/<sitio>.conf

ServerRoot "{{ server_root }}"
DefaultRuntimeDir "{{ runtime }}"
PidFile "{{ tmp }}/apache.pid"
# En todas las interfaces, como Nginx (en macOS es lo que permite usar el
# puerto 80 sin ser administrador).
Listen 0.0.0.0:{{ http_port }}
{%- if ssl %}
Listen 0.0.0.0:{{ https_port }}
{%- endif %}
{%- for module in modules %}
LoadModule {{ module.0 }} "{{ modules_dir }}/{{ module.1 }}"
{%- endfor %}
{%- if windows %}
# Evita problemas de AcceptEx con algunos antivirus y VPN de Windows.
AcceptFilter http none
AcceptFilter https none
{%- endif %}

ServerName localhost
ServerAdmin admin@localhost
Timeout 300
ErrorLog "{{ logs }}/apache-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "{{ logs }}/apache-access.log" combined
TypesConfig "{{ mime_types }}"
DirectoryIndex index.php index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Files ".ht*">
    Require all denied
</Files>

# PHP por FastCGI{% if balancer %}, repartido entre los php-cgi{% endif %}. mod_proxy_fcgi le
# antepone "/" a la ruta del script ("/C:/..." en Windows): la arma Apache.
ProxyTimeout 300
ProxyFCGIBackendType GENERIC
ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{DOCUMENT_ROOT}%{reqenv:SCRIPT_NAME}"
{%- if balancer %}
<Proxy "balancer://php">
{%- for port in php_ports %}
    BalancerMember "fcgi://127.0.0.1:{{ port }}"
{%- endfor %}
</Proxy>
{%- endif %}
<FilesMatch "\.php$">
    SetHandler "{{ php_handler }}"
</FilesMatch>
{%- if ssl %}

SSLSessionCache "shmcb:{{ runtime }}/ssl_scache(512000)"
{%- endif %}

# http://localhost muestra la lista de proyectos de www/
<VirtualHost *:{{ http_port }}>
    ServerName localhost
    DocumentRoot "{{ www }}"
    <Directory "{{ www }}">
        Options Indexes FollowSymLinks
        AllowOverride All
        CGIPassAuth On
        Require all granted
    </Directory>
</VirtualHost>

IncludeOptional "{{ sites_dir }}/*.conf"
