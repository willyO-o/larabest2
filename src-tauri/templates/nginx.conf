# Generado por {{ app_name }}. No editar: se regenera en cada inicio.
# Para configuración propia de un sitio crea {{ custom_dir }}/<sitio>.conf

worker_processes  1;
{%- if foreground %}
# En primer plano: la app vigila el proceso y lo detiene al salir.
daemon off;
{%- endif %}
pid        "{{ tmp }}/nginx.pid";
error_log  "{{ logs }}/nginx-error.log" warn;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 64m;
    server_names_hash_bucket_size 128;

    access_log  "{{ logs }}/nginx-access.log";

    client_body_temp_path "{{ tmp }}/nginx/client_body";
    proxy_temp_path       "{{ tmp }}/nginx/proxy";
    fastcgi_temp_path     "{{ tmp }}/nginx/fastcgi";
    uwsgi_temp_path       "{{ tmp }}/nginx/uwsgi";
    scgi_temp_path        "{{ tmp }}/nginx/scgi";

    upstream php_upstream {
{%- for port in php_ports %}
        server 127.0.0.1:{{ port }};
{%- endfor %}
    }

    # http://localhost muestra la lista de proyectos de www/
    server {
        listen {{ http_port }} default_server;
        server_name localhost;
        root "{{ www }}";
        index index.php index.html;
        autoindex on;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass php_upstream;
        }
    }

    include "{{ sites_dir }}/*.conf";
    # Proyectos compartidos en la red local (un puerto cada uno).
    include "{{ shared_dir }}/*.conf";
}
