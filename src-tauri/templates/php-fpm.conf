; Generado por {{ app_name }} para PHP {{ version }}. No editar: se regenera en cada inicio.
; Los ajustes de PHP van en php.ini; los propios, en {{ custom_dir }}.

[global]
pid = "{{ tmp }}/php-fpm.pid"
error_log = "{{ logs }}/php-fpm.log"
daemonize = no

[www]
listen = 127.0.0.1:{{ port }}
listen.allowed_clients = 127.0.0.1
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Los procesos de PHP heredan el entorno de la app.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
