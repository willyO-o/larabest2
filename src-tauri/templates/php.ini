; Generado por {{ app_name }} para PHP {{ version }}. No editar: se regenera en cada inicio.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
memory_limit = {{ settings.memoryLimit }}
max_execution_time = {{ settings.maxExecutionTime }}
max_input_time = 120
max_input_vars = 3000
post_max_size = {{ settings.uploadMaxFilesize }}
upload_max_filesize = {{ settings.uploadMaxFilesize }}
file_uploads = On

display_errors = {{ 'On' if settings.displayErrors else 'Off' }}
display_startup_errors = {{ 'On' if settings.displayErrors else 'Off' }}
error_reporting = E_ALL
log_errors = On
error_log = "{{ logs }}/php-error.log"

upload_tmp_dir = "{{ tmp }}/php"
sys_temp_dir = "{{ tmp }}/php"
cgi.fix_pathinfo = 1

{% if ext_dir -%}
extension_dir = "{{ ext_dir }}"
{%- for ext in extensions %}
extension={{ ext }}
{%- endfor %}
{%- else -%}
; Las extensiones vienen compiladas en el PHP de Homebrew.
{%- endif %}

[mail function]
{%- if sendmail %}
; El correo de mail() lo atrapa Mailpit.
sendmail_path = "{{ sendmail }}"
{%- elif smtp_port %}
; El correo de mail() va a Mailpit (Windows envía por SMTP).
SMTP = 127.0.0.1
smtp_port = {{ smtp_port }}
sendmail_from = "php@localhost"
{%- endif %}

[Session]
session.save_path = "{{ tmp }}/php/sessions"
{%- if xdebug %}

[xdebug]
; Menú → PHP → Ajustes rápidos → Xdebug. El IDE escucha en el puerto {{ xdebug_port }}.
zend_extension = "{{ xdebug }}"
xdebug.mode = debug,develop
xdebug.start_with_request = yes
xdebug.client_host = 127.0.0.1
xdebug.client_port = {{ xdebug_port }}
xdebug.log_level = 0
{%- endif %}
