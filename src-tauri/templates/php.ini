; Generado por {{ app_name }} para PHP {{ version }}. No editar: se regenera en cada inicio.

[PHP]
engine = On
short_open_tag = Off
expose_php = Off
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000
post_max_size = 64M
upload_max_filesize = 64M
file_uploads = On

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = "{{ logs }}/php-error.log"

upload_tmp_dir = "{{ tmp }}/php"
sys_temp_dir = "{{ tmp }}/php"
cgi.fix_pathinfo = 1

extension_dir = "ext"
{%- for ext in extensions %}
extension={{ ext }}
{%- endfor %}

[Session]
session.save_path = "{{ tmp }}/php/sessions"
