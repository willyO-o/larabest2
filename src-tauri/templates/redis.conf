# Generado por {{ app_name }} para Redis {{ version }}. No editar: se regenera en cada inicio.
# Tus ajustes van en etc/redis/custom/user.conf (se incluye al final).

bind 127.0.0.1
port {{ port }}
protected-mode yes
daemonize no

# La carpeta de trabajo es data/redis. Las rutas son relativas: el Redis de
# Windows no entiende rutas con letra de unidad.
dir ./
dbfilename dump.rdb
logfile ""
save 3600 1
save 300 100
save 60 10000
appendonly no

include ../../etc/redis/custom/user.conf
