# Generado por {{ app_name }}: {{ name }} compartido en la red local.
# Se quita al dejar de compartirlo (Menú → www → Compartir en la red local).

Listen 0.0.0.0:{{ port }}

<VirtualHost *:{{ port }}>
    DocumentRoot "{{ root }}"
    <Directory "{{ root }}">
        Options FollowSymLinks
        AllowOverride All
        CGIPassAuth On
        Require all granted
    </Directory>
    IncludeOptional "{{ custom_dir }}/{{ name }}.conf*"
</VirtualHost>
